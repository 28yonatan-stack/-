<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowComm - Secure Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- המיכל הראשי של כל המסך -->
    <div class="main-container">

        <!-- צד שמאל: לוגו הסייבר המקורי והנכון של ShadowComm -->
        <div class="left-side">
            <div class="logo-container">
                <!-- קוד SVG המציג את המגן החד והאות S המקורית במרכז בדיוק כמו במותג שלך -->
                <svg class="shield-icon" viewBox="0 0 200 200" xmlns="http://w3.org">
                    <defs>
                        <!-- גרדיאנטים כחולים למראה תלת ממדי עמוק -->
                        <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1e3a8a" />
                            <stop offset="60%" stop-color="#1d4ed8" />
                            <stop offset="100%" stop-color="#2563eb" />
                        </linearGradient>
                        <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#0284c7" />
                        </linearGradient>
                        <!-- אפקט זוהר כחלחל מסביב למגן -->
                        <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    
                    <!-- צורת המגן המחודדת והחדה בדיוק לפי הקימורים המקוריים -->
                    <path d="M100,25 C125,25 165,38 165,38 C165,38 165,100 100,165 C35,100 35,38 35,38 C35,38 75,25 100,25 Z" 
                          fill="url(#shieldBg)" stroke="url(#neonCyan)" stroke-width="6" filter="url(#glowEffect)"/>
                    
                    <!-- מסגרת פנימית כהה ליצירת נפח תלת ממדי במגן -->
                    <path d="M100,33 C120,33 153,44 153,44 C153,44 153,95 100,150 C47,95 47,44 47,44 C47,44 80,33 100,33 Z" 
                          fill="#0b0f19" opacity="0.75"/>
                    
                    <!-- האות S המעוקלת והזורמת המקורית של המותג שלך (ללא מנעול) -->
                    <path d="M128,72 C125,60 112,54 100,54 C82,54 74,66 74,78 C74,102 126,96 126,120 C126,134 114,144 98,144 C80,144 70,132 70,122" 
                          fill="none" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)"/>
                </svg>
                <div class="logo-text">
                    <span class="brand-name">ShadowComm</span>
                    <span class="brand-sub">SECURE MESSAGING</span>
                </div>
            </div>
        </div>

        <!-- צד ימין: מוקאפ הטלפון בעיצובו הנקי -->
        <div class="right-side">
            <div class="phone-mockup">
                <div class="phone-camera"></div>
                <div class="phone-screen">
                    
                    <div class="login-header">
                        <h1>Login Account</h1> 
                        <p>Don't have an account? <a href="#" class="register-link">Sign up</a></p> 
                    </div> 

                    <form class="login-form">
                        <div class="input-group">
                            <label for="email">Email Address</label> 
                            <input type="email" id="email" placeholder="name@company.com"> 
                        </div> 

                        <div class="input-group">
                            <label for="password">Password</label> 
                            <div class="password-wrapper">
                                <input type="password" id="password" placeholder="••••••••"> 
                                <svg id="togglePassword" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </div>
                            <div class="password-options-row">
                                <label class="remember-me">
                                    <input type="checkbox" id="remember">
                                    <span>Remember me</span>
                                </label>
                                <a href="#" class="forgot-link">Forgot password?</a> 
                            </div>
                        </div> 

                        <button type="submit" class="btn-submit">Login Securely</button>
                    </form> 

                    <div class="separator">
                        <span>or</span>
                    </div> 

                    <div class="social-login-container">
                        <button type="button" class="btn-social google">
                            <svg viewBox="0 0 24 24" width="16" height="16">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            <span>Google</span>
                        </button>

                        <button type="button" class="btn-social facebook">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                            <span>Facebook</span>
                        </button>

                        <button type="button" class="btn-social microsoft">
                            <svg viewBox="0 0 23 23" width="14" height="14" fill="currentColor">
                                <path d="M0 0h11v11H0zM12 0h11v11H12zM0 12h11v11H0zM12 12h11v11H12z"/>
                            </svg>
                            <span>Microsoft</span>
                        </button>
                    </div> 

                    <p class="privacy-row">
                        By signing in, you agree to our <a href="#" class="privacy-link">Privacy Policy</a>
                    </p>
                    
                </div>
            </div>
        </div>

    </div>

    <!-- ג'אווה סקריפט להפעלת העין של הסיסמה -->
    <script>
        const togglePassword = document.getElementById('togglePassword'); 
        const passwordInput = document.getElementById('password');       

        togglePassword.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
            } else {
                passwordInput.type = 'password';
                togglePassword.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>';
            }
        });
    </script>
</body> 
</html>
